# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build

on:
  push:
    branches:
      - "develop"
  pull_request:
    branches:
      - "*"
  workflow_call: {}

permissions:
  contents: read

jobs:
  Build:
    outputs:
      run_id: "${{github.run_id}}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # We need tags and commits since the last tag for versioning
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Get latest git tag
        id: git_tag
        run: |
          if [ -z "$git_tag" ]; then
            echo "git_tag=$(git describe --tags --dirty=-dirty)" >> $GITHUB_ENV
          fi
      - name: Set build variables
        id: build-vars
        run: |
          GIT_VERSION="${{env.git_tag}}"
          PREFIX=$(echo "$GIT_VERSION" | cut -d '-' -f 1)
          SUFFIX=$(echo "$GIT_VERSION" | cut -d '-' -f 2- -s)

          echo "version_prefix=${PREFIX}" >> $GITHUB_ENV

          if [[ "${{ github.ref }}" == "refs/tags"* ]]; then
            if [[ ! -z "$SUFFIX" ]]; then
              echo "Tag release determined a suffix: $SUFFIX"
              exit 1;
            fi

            echo "version_suffix=$SUFFIX" >> $GITHUB_ENV
            echo "package_suffix=release" >> $GITHUB_ENV
          else
            echo "version_suffix=dev-${SUFFIX}" >> $GITHUB_ENV
            echo "package_suffix=snapshot" >> $GITHUB_ENV
          fi

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -p:VersionPrefix="${{env.version_prefix}}" -p:VersionSuffix="${{env.version_suffix}}"
      #    - name: Upload a Build Artifact
      #      uses: actions/upload-artifact@v4
      #      with:
      #        if-no-files-found: warn
      #        name: build
      #        path: |
      #          */bin/Debug
      - name: Test
        run: dotnet test --no-build --verbosity normal -p:VersionPrefix="${{env.version_prefix}}" -p:VersionSuffix="${{env.version_suffix}}" --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

      - name: Pack
        run: dotnet pack --no-build -c Debug -p:VersionPrefix="${{env.version_prefix}}" -p:VersionSuffix="${{env.version_suffix}}" --output nupkgs
      - name: Pack Symbols
        run: dotnet pack --no-build -c Debug -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:VersionPrefix="${{env.version_prefix}}" -p:VersionSuffix="${{env.version_suffix}}" --output nupkgs
      - name: Upload nupkgs
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: "nupkgs-${{env.package_suffix}}"
          path: nupkgs

  # Checks the generated code against other GodotSharp versions than the one pinned in the test project.
  Compatibility:
    name: "Compatibility (GodotSharp ${{ matrix.godot }})"
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported version, see README
          - godot: "4.3.0"
            experimental: false
          # Latest stable 4.x
          - godot: "4.*"
            experimental: false
          # Latest 4.x, including dev/beta/rc builds, to catch upcoming breaking changes early
          - godot: "4.*-*"
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
      - name: Test
        run: dotnet test -p:GodotSharpVersion="${{ matrix.godot }}" --verbosity normal
      - name: Report resolved GodotSharp version
        if: always()
        # `dotnet list package` ignores the -p override, so read what restore actually resolved
        run: grep -oE '"GodotSharp/[^"]+"' GodotHat.SourceGenerators.Test/obj/project.assets.json | head -1

  # Builds a Godot project against the packed nupkgs with each supported .NET SDK and Godot version, to check the
  # generators load in that SDK's compiler and work alongside that Godot's own source generators. The unit tests can't
  # cover this as they use the Roslyn version referenced by the test project.
  Smoke:
    name: "Smoke (.NET ${{ matrix.dotnet }} SDK, Godot ${{ matrix.godot }})"
    runs-on: ubuntu-latest
    # Latest may pick up a Godot dev/beta/rc build, which shouldn't block PRs
    continue-on-error: ${{ matrix.godot == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        # 8.0 and 4.3.0 are the oldest supported, see README. Stable is the newest 4.x Godot.NET.Sdk release, latest
        # also includes dev/beta/rc builds.
        dotnet: ["8.0", "9.0", "10.0"]
        godot: ["4.3.0", "4.7.2", "stable", "latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0 is needed to build GodotHat itself
          dotnet-version: |
            ${{ matrix.dotnet }}.x
            10.0.x
      - name: Pack
        run: dotnet pack --output nupkgs
      - name: Pin smoke test SDKs
        working-directory: GodotHat.SmokeTest
        env:
          DOTNET_SDK: ${{ matrix.dotnet }}
          GODOT_SDK: ${{ matrix.godot }}
        run: |
          # msbuild-sdks doesn't support floating versions, so resolve "stable"/"latest" from nuget. Prerelease
          # versions are the ones with a "-" suffix, eg 4.8.0-dev.6.
          case "$GODOT_SDK" in
            stable) FILTER='[.versions[] | select(startswith("4.") and (contains("-") | not))] | last' ;;
            latest) FILTER='[.versions[] | select(startswith("4."))] | last' ;;
          esac
          if [ -n "${FILTER:-}" ]; then
            GODOT_SDK=$(curl -sf https://api.nuget.org/v3-flatcontainer/godot.net.sdk/index.json | jq -r "$FILTER")
          fi
          jq -n --arg dotnet "$DOTNET_SDK.100" --arg godot "$GODOT_SDK" \
            '{sdk: {version: $dotnet, rollForward: "latestFeature"}, "msbuild-sdks": {"Godot.NET.Sdk": $godot}}' \
            > global.json
          cat global.json
          dotnet --version
      - name: Build smoke test
        working-directory: GodotHat.SmokeTest
        run: dotnet build -p:SmokeTargetFramework=net${{ matrix.dotnet }}

  # Runs GodotHat.Binding's engine tests inside Godot (headless) with GdUnit4, against the packed nupkgs.
  BindingEngine:
    name: "Binding engine tests (Godot ${{ matrix.godot }})"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.7.2"]
    env:
      GODOT_DIR: ${{ github.workspace }}/../godot
      GODOT_BIN: ${{ github.workspace }}/../godot/Godot_v${{ matrix.godot }}-stable_mono_linux_x86_64/Godot_v${{ matrix.godot }}-stable_mono_linux.x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ matrix.godot }}-stable-mono-linux-x86_64
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR"
          curl -fsSL -o "$GODOT_DIR/godot.zip" "https://github.com/godotengine/godot-builds/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_mono_linux_x86_64.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          rm "$GODOT_DIR/godot.zip"
      - name: Godot version
        run: '"$GODOT_BIN" --version'
      - name: Pack
        run: dotnet pack --output nupkgs
      - name: Engine tests
        working-directory: GodotHat.Binding.Smoke
        # GdUnit4 builds the project, imports it in the editor, then runs the tests in Godot, see .runsettings
        run: dotnet test --logger "trx;LogFileName=test-results.trx"
      - name: Editor smoke test
        working-directory: GodotHat.Binding.Smoke
        # Drives the inspector, dock and preview in a headless editor, see editor_smoke/editor_smoke.gd
        env:
          GODOTHAT_EDITOR_SMOKE: "1"
        run: '"$GODOT_BIN" --headless -e --path .'
      - name: Build sample
        working-directory: samples/BindingSample
        run: dotnet build
      - name: Validate sample bindings
        working-directory: samples/BindingSample
        # Import first so resources and script UIDs are known, then check every binding as users would in their CI
        run: |
          "$GODOT_BIN" --headless --path . --import
          "$GODOT_BIN" --headless --path . --script res://addons/godothat_binding/ValidateBindings.cs
      - name: Sample tests
        working-directory: samples/BindingSample
        # The sample's own tests, which use GodotHat.Binding.Testing
        run: dotnet test --logger "trx;LogFileName=test-results.trx"
      - name: Sample view model tests
        working-directory: samples/BindingSample.ViewModels.Test
        run: dotnet test --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binding-engine-test-results-${{ matrix.godot }}
          path: |
            GodotHat.Binding.Smoke/**/test-results.trx
            samples/**/test-results.trx
