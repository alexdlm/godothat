name: Build Release and Deploy
on:
  push:
    tags:
      - '*'

permissions:
  actions: read
  contents: read

jobs:
  build:
    uses: ./.github/workflows/dotnet.yml
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: nuget/setup-nuget@v1
        with:
          nuget-api-key: ${{ secrets.NUGET_API_KEY }}
          nuget-version: "6.x"
      - name: Get built packages
        uses: actions/download-artifact@v4
        with:
          name: nupkgs-release
      - name: Publish nupkgs
        run: |
          ls -l
          nuget push 'GodotHat.Attributes.*.nupkg' -Source https://api.nuget.org/v3/index.json -SkipDuplicate
          nuget push 'GodotHat.SourceGenerators.*.nupkg' -Source https://api.nuget.org/v3/index.json -SkipDuplicate
